# PlatformApplication - High-level application manifest
# API: meta.p6m.dev/v1alpha1
# Operator: platform-application-operator (Rust/kube-rs)
#
# This CRD is processed by the operator to generate:
# - Deployment, Service, ServiceAccount, ConfigMap
# - HPA, PDB, NetworkPolicy, RoleBinding
# - ExternalSecret (AWS Secrets Manager / Azure Key Vault)
# - Istio resources (VirtualService, AuthorizationPolicy, etc.)
# - IRSA (AWS) or WorkloadIdentity (Azure) for pod identity
# - CloudFront CDN (if enabled)
# - CockroachDB database/user (if requested)
#
# Variables: test-app, test-app, 8080, /readyz, true, false
# Blocks:    config_block, secrets_block, mcp_annotations_block, outbound_block, resource_requirements_block
#
# Default ports by language:
#   Python (uv/pip): 8080 (Uvicorn default)
#   Node.js: 3000
#   Go/Java/Rust: 8080

apiVersion: meta.p6m.dev/v1alpha1
kind: PlatformApplication
metadata:
  name: test-app
  labels:
    p6m.dev/app: test-app
    # p6m.dev/domain: <domain>         # Optional: domain grouping
  # ============================================
  # MCP EXPOSURE (openapi-mcp-adapter)
  # ============================================
  # Opt in to expose this service's OpenAPI endpoints as MCP tools. Driven by
  # detect_exposed_endpoints + the user's per-endpoint selection. Exposing all
  # endpoints is discouraged — mcp.p6m.dev/exposed-endpoints scopes it.
  annotations:
    mcp.p6m.dev/expose: "true"
    mcp.p6m.dev/exposed-endpoints: "GET /items"
spec:
  # ============================================
  # ENVIRONMENT VARIABLES
  # ============================================
  # Key-value pairs injected as environment variables.
  # Supports variable interpolation: $(crdb_name_jdbc_connection_string)
  # Driven by detect_secrets_usage's detected_config_vars — Cortex surfaces
  # every env var it inferred so the user can audit before flipping them on.
  config:
    # Detected by Cortex — set values before deploying.
    BLOB_CONTAINER: "exports"
    BLOB_PREFIX: "dumps/"
    DB_POOL_SIZE: "5"
    DB_MAX_OVERFLOW: "10"
    DATABASE_URL: "postgresql+asyncpg://$(TEST_APP_DB_USERNAME):$(TEST_APP_DB_PASSWORD)@$(TEST_APP_DB_HOST):$(TEST_APP_DB_PORT)/$(TEST_APP_DB_DBNAME)"

  # ============================================
  # DEPLOYMENT
  # ============================================
  deployment:
    image: test-app-server:latest
    ports:
      - protocol: http
        port: 8080
      # - protocol: grpc
      #   port: 9090
    readinessProbe:
      port: 8080
      path: /readyz
    # resources:
    #   requests:
    #     cpu: "100m"
    #     memory: "128Mi"
    #   limits:
    #     cpu: "500m"
    #     memory: "512Mi"
    # readOnlyRootFilesystem: true

  # ============================================
  # SECRETS (from cloud secret stores)
  # ============================================
  # Synced via External Secrets Operator from Azure Key Vault / AWS Secrets Manager
  # Driven by detect_secrets_usage — needs_secrets=true emits the block active;
  # otherwise it stays commented so the docs survive in-place.
  secrets:
    - name: test-app-secrets

  # ============================================
  # CLOUD RESOURCES (access policies only)
  # ============================================
  # NOTE: Does NOT create resources, only grants access
  # Resources must be provisioned separately via Crossplane
  # Exception: crdb DOES create database + user
  # resources:
  #   crdb:
  #     - name: test-app
  #   s3bucket:
  #     - name: bucket-name
  #       accesses: [read, write]

  # ============================================
  # DATABASE PROVISIONING (platform-resource-operator)
  # ============================================
  # Driven by detect_secrets_usage's needs_database + user's db_mode choice.
  # CNPG: provisions a dedicated CloudNativePG cluster; operator auto-injects
  # connection credentials as env vars — no manual DATABASE_URL needed.
  resourceRequirements:
    - resourceType: postgresql
      resourceName: test-app-db
      provider: cnpg
      scope: Private
      parameters:
        dbName: appdb

  # ============================================
  # AUTOSCALING (HPA + KEDA)
  # ============================================
  # autoscaling:
  #   enabled: true
  #   minReplicas: 1
  #   maxReplicas: 10
  #   triggers:  # KEDA cron trigger
  #     - type: cron
  #       metadata:
  #         timezone: America/Los_Angeles
  #         start: 0 6 * * 1
  #         end: 0 18 * * 5
  #         desiredReplicas: "2"

  # ============================================
  # WORKLOAD SELECTORS
  # ============================================
  workloadSelectors:
    kubernetes.io/architectures: amd64,arm64

  # ============================================
  # NETWORKING
  # ============================================
  networking:
    ingress:
      enabled: true
      # true selects the public-oidc gateway; false selects public-open,
      # which serves the app to the internet with no authentication.
      oidc: true
      # type: istio
      # hostnames:
      #   - test-app.region.env.org.p6m.run
      # path: /
      # visibility: PublicIP
      # cdn:
      #   enabled: false

    # Inbound: services allowed to call this app
    # IMPORTANT: When ingress is enabled, include self-reference to allow
    # the ingress gateway to route traffic to this service (HTTPRoute)
    inbound:
      services:
        - name: test-app
          namespace: test-app
          port: 8080
      # Additional callers:
      # - name: caller-service
      #   namespace: caller-ns
      #   port: 8080

    # Outbound: services this app can call
    # outbound:
    #   - hostname: external-db.example.com
    #     port: 5432
    #     protocol: TCP
