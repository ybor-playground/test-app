apiVersion: meta.p6m.dev/v1alpha1
kind: PlatformApplication
metadata:
  name: test-app
  namespace: test-app
  labels:
    p6m.dev/app: test-app
spec:
  config:
    SERVER_PORT: "8080"
    MANAGEMENT_PORT: "8081"
    LOGGING_STRUCTURED: "true"
    # Platform-injected at deploy time:
    # OTEL_SERVICE_NAME: "test-app"
    # OTEL_EXPORTER_OTLP_ENDPOINT: "<cluster-collector>"
  deployment:
    image: https://p6m.jfrog.io/ybor-playground/test-app:latest
    readOnlyRootFilesystem: false
    ports:
      - protocol: http
        port: 8080
      - protocol: http
        port: 8081
    readinessProbe:
      port: 8081
      path: /health/readiness
